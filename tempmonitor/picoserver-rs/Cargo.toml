[package]
name = "picoserver-rs"
version = "0.1.0"
edition = "2021"
description = "Temperature monitor HTTP server for Raspberry Pi Pico W"

[dependencies]
cortex-m-rt = "0.7.3"
cyw43 = { version = "=0.5.0", features = ["firmware-logs"] }
cyw43-pio = "=0.8.0"
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-thread", "nightly"] }
embassy-futures = "0.1.2"
embassy-net = { version = "0.8.0", features = ["tcp", "proto-ipv4", "medium-ethernet", "dhcpv4"] }
embassy-rp = { version = "=0.8.0", features = ["rp2040", "critical-section-impl", "time-driver"] }
embassy-sync = "0.7.2"
embassy-time = "0.5.0"
embassy-usb-logger = "0.5.1"
heapless = "0.8.0"
log = { version = "0.4.22", default-features = false }
panic-persist = { version = "0.3.0", features = ["utf8"] }
picoserve = { version = "0.18.0", features = ["embassy", "log", "json"] }
portable-atomic = { version = "1.7.0", features = ["critical-section"], default-features = false }
rand = { version = "0.9.0", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
static_cell = "2.1.0"

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
debug = 2
lto = true
